name: kafka-learning-lab-msk
services:
  topic-bootstrap:
    build: {context: ../.., dockerfile: services/Dockerfile}
    env_file: ../../.env
    environment: {SERVICE_NAME: topic-bootstrap}
    command: ["python", "-m", "services.topic_bootstrap"]
  kafka-ui:
    # v1.3.0 preserves topic message totals in the topic-list view.
    # Newer releases show N/A there despite records being readable per topic.
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports: ["${HTTP_HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"]
    env_file: ../../.env
    environment:
      KAFKA_CLUSTERS_0_NAME: learning-lab-msk
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: AWS_MSK_IAM
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: software.amazon.msk.auth.iam.IAMLoginModule required;
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  order-api:
    build: {context: ../.., dockerfile: services/Dockerfile}
    env_file: ../../.env
    environment: {SERVICE_NAME: order-api}
    command: ["uvicorn", "services.order_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${HTTP_HOST_BIND_ADDRESS:-127.0.0.1}:8000:8000"]
    depends_on: {topic-bootstrap: {condition: service_completed_successfully}}
