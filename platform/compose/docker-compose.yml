name: kafka-learning-lab

services:
  kafka-data-init:
    image: apache/kafka:4.1.1
    user: "0:0"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/kraft-combined-logs
        chown -R 1000:1000 /tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka-learning-lab
    hostname: kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  topic-bootstrap:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../../scripts/bootstrap-topics.sh:/scripts/bootstrap-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/bootstrap-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui-learning-lab
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "learning-lab"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
      DYNAMIC_CONFIG_ENABLED: "false"

  order-api:
    build:
      context: ../..
      dockerfile: services/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SERVICE_NAME: "order-api"
    command: ["uvicorn", "services.order_api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"

  payment-processor:
    build:
      context: ../..
      dockerfile: services/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SERVICE_NAME: "payment-processor"
    command: ["python", "-m", "services.payment_processor"]
    depends_on:
      kafka:
        condition: service_healthy

  fulfillment-processor:
    build:
      context: ../..
      dockerfile: services/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      SERVICE_NAME: "fulfillment-processor"
    command: ["python", "-m", "services.fulfillment_processor"]
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  kafka-data:
    name: kafka-learning-lab-data
