<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kafka Event Flow</title><style>body{font:16px system-ui;background:#101827;color:#e5e7eb;max-width:850px;margin:40px auto;padding:0 20px}input,select,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #475569}button{background:#22c55e;font-weight:bold;cursor:pointer}.event{margin:12px 0;padding:14px;border-left:5px solid #38bdf8;background:#1e293b;border-radius:5px}.pending{opacity:.45}small{color:#94a3b8}code{color:#86efac}</style></head><body><h1>Kafka Event Flow</h1><p>Create an order and watch events observed from Kafka topics.</p><form id="form"><input id="id" placeholder="order id" required><input id="item" placeholder="item" value="coffee" required><input id="amount" type="number" value="42.5" min="0.01" step="0.01" required><select id="failure"><option value="none">successful payment</option><option value="transient">transient failure → retry</option><option value="terminal">terminal failure → DLQ</option></select><button>Create order</button></form><h2 id="title">Waiting for an order</h2><div id="events"></div><script>const stages=['order.created','payment.requested','payment.completed','order.fulfilled'];let timer;const out=document.querySelector('#events');const idInput=document.querySelector('#id');idInput.value=`order-ui-${Date.now()}`;function draw(events){out.innerHTML='';stages.forEach(topic=>{const e=events.find(x=>x.topic===topic);out.innerHTML+=`<div class="event ${e?'':'pending'}"><b>${topic}</b>${e?`<br><code>${e.event_type}</code><br><small>partition ${e.partition}, offset ${e.offset}, ${e.occurred_at}</small>`:'<br><small>Waiting...</small>'}</div>`});events.filter(e=>e.topic==='order.retry'||e.topic==='order.dlq').forEach(e=>out.innerHTML+=`<div class="event"><b>${e.topic}</b><br><code>${e.event_type}</code></div>`)}async function poll(id){const r=await fetch(`/orders/${id}/timeline`);const x=await r.json();draw(x.events);if(x.events.length<4)timer=setTimeout(()=>poll(id),700)}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();clearTimeout(timer);const id=idInput.value;document.querySelector('#title').textContent=`Order ${id}`;draw([]);await fetch('/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order_id:id,item:document.querySelector('#item').value,amount:Number(document.querySelector('#amount').value),simulate_payment_failure:document.querySelector('#failure').value})});poll(id)}</script></body></html>
