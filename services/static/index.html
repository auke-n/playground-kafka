<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kafka Event Flow</title><style>body{font:16px system-ui;background:#101827;color:#e5e7eb;max-width:850px;margin:40px auto;padding:0 20px}input,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #475569}button{background:#22c55e;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.event{margin:12px 0;padding:14px;border-left:5px solid #38bdf8;background:#1e293b;border-radius:5px}.pending{opacity:.45}small{color:#94a3b8}code{color:#86efac}#actions{margin:20px 0}</style></head><body><h1>Kafka Event Flow</h1><p>Create one event, inspect it in Kafka UI, then manually execute each next processing stage.</p><form id="form"><input id="id" placeholder="order id" required><input id="item" placeholder="item" value="coffee" required><input id="amount" type="number" value="42.5" min="0.01" step="0.01" required><button>Create order.created</button></form><h2 id="title">Waiting for an order</h2><div id="actions"></div><div id="events"></div><script>const stages=['order.created','payment.requested','payment.completed','order.fulfilled'];const actions=[['payment.requested','Process payment request','payment-request'],['payment.completed','Complete payment','payment-complete'],['order.fulfilled','Fulfill order','fulfill']];let timer,id='';const out=document.querySelector('#events'),actionsOut=document.querySelector('#actions'),idInput=document.querySelector('#id');idInput.value=`order-ui-${Date.now()}`;function draw(events){out.innerHTML='';const seen=new Set(events.map(e=>e.topic));stages.forEach(topic=>{const e=events.find(x=>x.topic===topic);out.innerHTML+=`<div class="event ${e?'':'pending'}"><b>${topic}</b>${e?`<br><code>${e.event_type}</code><br><small>partition ${e.partition}, offset ${e.offset}, ${e.occurred_at}</small>`:'<br><small>Waiting...</small>'}</div>`});actionsOut.innerHTML=actions.map(([topic,label,path],i)=>`<button ${seen.has(stages[i])&&!seen.has(topic)?'':'disabled'} onclick="step('${path}')">${label}</button>`).join('')}async function poll(){const r=await fetch(`/orders/${id}/timeline`),x=await r.json();draw(x.events);timer=setTimeout(poll,700)}async function step(path){await fetch(`/orders/${id}/manual/${path}`,{method:'POST'});poll()}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();clearTimeout(timer);id=idInput.value;document.querySelector('#title').textContent=`Order ${id}`;await fetch('/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order_id:id,item:document.querySelector('#item').value,amount:Number(document.querySelector('#amount').value)})});poll()}</script></body></html>
