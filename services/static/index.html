<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kafka Event Flow</title>
  <style>
    body{font:16px system-ui;background:#101827;color:#e5e7eb;max-width:850px;margin:40px auto;padding:0 20px}input,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #475569}button{background:#22c55e;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.event{margin:12px 0;padding:14px;border-left:5px solid #38bdf8;background:#1e293b;border-radius:5px}.pending{opacity:.45}.queued{border-left-color:#facc15}small{color:#94a3b8}code{color:#86efac}#actions{margin:20px 0}
  </style>
</head>
<body>
  <h1>Kafka Event Flow</h1>
  <p>Create one event, inspect it in Kafka UI, then manually execute each next processing stage.</p>
  <form id="form">
    <input id="id" placeholder="order id" required>
    <input id="item" placeholder="item" value="coffee" required>
    <input id="amount" type="number" value="42.5" min="0.01" step="0.01" required>
    <button>Create order.created</button>
  </form>
  <h2 id="title">Waiting for an order</h2>
  <div id="actions"></div>
  <div id="events"></div>
  <script>
    const stages = ['order.created', 'payment.requested', 'payment.completed', 'order.fulfilled'];
    const actions = [
      ['payment.requested', 'Process payment request', 'payment-request'],
      ['payment.completed', 'Complete payment', 'payment-complete'],
      ['order.fulfilled', 'Fulfill order', 'fulfill'],
    ];
    let timer;
    let id = '';
    let pending = [];
    let confirmed = [];
    const out = document.querySelector('#events');
    const actionsOut = document.querySelector('#actions');
    const idInput = document.querySelector('#id');
    idInput.value = `order-ui-${Date.now()}`;

    function draw(events) {
      out.innerHTML = '';
      const seen = new Set(events.map(event => event.topic));
      stages.forEach(topic => {
        const event = events.find(entry => entry.topic === topic);
        out.innerHTML += `<div class="event ${event ? '' : 'pending'} ${event?.delivery_status === 'queued' ? 'queued' : ''}"><b>${topic}</b>${event ? `<br><code>${event.delivery_status === 'queued' ? 'Queued for Kafka' : event.event_type}</code><br><small>${event.delivery_status === 'queued' ? 'Waiting for broker confirmation' : `partition ${event.partition}, offset ${event.offset}, ${event.occurred_at}`}</small>` : '<br><small>Waiting...</small>'}</div>`;
      });
      actionsOut.innerHTML = actions.map(([topic, label, path], index) => `<button ${seen.has(stages[index]) && !seen.has(topic) ? '' : 'disabled'} onclick="step('${path}')">${label}</button>`).join('');
    }

    function render(events) {
      confirmed = events;
      pending = pending.filter(event => !events.some(entry => entry.event_id === event.event_id));
      draw([...events, ...pending]);
    }

    function localStage(topic) {
      return {event_id: `local-${crypto.randomUUID()}`, topic, event_type: 'queued', occurred_at: new Date().toISOString(), delivery_status: 'queued'};
    }

    async function responseJson(response) {
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || 'Request failed');
      return body;
    }

    async function poll() {
      const response = await responseJson(await fetch(`/orders/${id}/timeline`));
      render(response.events);
      timer = setTimeout(poll, 50);
    }

    async function step(path) {
      const topic = actions.find(action => action[2] === path)[0];
      const local = localStage(topic);
      pending.push(local);
      render(confirmed);
      try {
        const response = await responseJson(await fetch(`/orders/${id}/manual/${path}`, {method: 'POST'}));
        pending = pending.filter(event => event.event_id !== local.event_id);
        render(response.events);
      } catch (error) {
        pending = pending.filter(event => event.event_id !== local.event_id);
        render(confirmed);
        alert(error.message);
      }
    }

    document.querySelector('#form').onsubmit = async event => {
      event.preventDefault();
      clearTimeout(timer);
      id = idInput.value;
      pending = [];
      confirmed = [];
      document.querySelector('#title').textContent = `Order ${id}`;
      const local = localStage('order.created');
      pending.push(local);
      render(confirmed);
      try {
        const response = await responseJson(await fetch('/orders', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({order_id: id, item: document.querySelector('#item').value, amount: Number(document.querySelector('#amount').value)}),
        }));
        pending = [];
        render(response.events);
        timer = setTimeout(poll, 50);
      } catch (error) {
        pending = [];
        render([]);
        alert(error.message);
      }
    };
  </script>
</body>
</html>
